name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build:web
      - run: npx cap add android
      - name: Permissões de notificações
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: postits-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
